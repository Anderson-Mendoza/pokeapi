<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
   
    <title>Pokeapi</title>
</head>
<body>

<header>
  <div class="brand">

     <img
      src="https://www.pngkey.com/png/full/144-1446994_pokeball-clipart-transparent-background-pokeball-png.png"
      alt="Pokeball"
      class="pokeball"
    />
    
    <img
      src="https://1000logos.net/wp-content/uploads/2017/05/Pokemon-Logo.png"
      alt="Pokemon Logo"
      class="pokemon-logo"
    />
   
  </div>

  <div class="title">
    <h1>Pokedex</h1>

    <div class="buscar-poke">
      <select id="filtro-tipo" class="filtro-tipo">
        <option value="">Todos los tipos</option>
      </select>
      <input id="input-buscar" class="input" type="text" placeholder="Buscar pokemon">
      <button class="btn-buscar">
        Buscar
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm4.28 10.28a.75.75 0 000-1.06l-3-3a.75.75 0 10-1.06 1.06l1.72 1.72H8.25a.75.75 0 000 1.5h5.69l-1.72 1.72a.75.75 0 101.06 1.06l3-3z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</header>
<main>
    <div class="container-btns-paginacion">
        <button id="atras"  > &#x1F448; </button>
        <span id="informacion-pagina"></span>
        <button id="siguiente"> &#x1F449; </button>
    </div>
    
<div id="todos" class="container-pokemons"></div>  

</main>
<footer></footer>
<script src="./src/index.js"  type="module"  defer></script>
</body>
</html>
